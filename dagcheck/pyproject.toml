[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dagcheck"
version = "0.1.0"
description = "Exploratory diagnostics for continuous structure-learning solvers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["dagcheck*"]
